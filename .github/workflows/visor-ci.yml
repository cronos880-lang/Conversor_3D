name: Visor - pruebas nativas
on:
  push:
    branches: ['desarrollo/hoja-ruta-visor', 'perfeccion_Visualizador_R20', 'perfeccion_Visualizador_R21']
    paths: ['visor/**', 'entregas/perfeccion_Visualizador_R20/**', '.github/workflows/visor-ci.yml']
  pull_request:
    paths: ['visor/**', '.github/workflows/visor-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Conservar bytes originales de las fuentes congeladas
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64
      - name: Instalar dependencias y paquete de desarrollo
        run: |
          python visor/scripts/install_dependencies.py
      - name: Integridad de las fuentes congeladas
        run: python visor/scripts/audit_frozen.py
      - name: Inventario de licencias del runtime instalado
        run: python visor/scripts/audit_licenses.py --output third-party-native.json
      - name: Pruebas nuevas y geometría con control frío
        run: python -m pytest -q -p no:cacheprovider visor/tests --junitxml=visor-tests.xml
      - name: Batería histórica congelada
        run: python visor/scripts/run_legacy_tests.py --xml legacy-tests.xml
      - name: Conversiones de cilindro, pared fina y taladro pequeño
        run: python visor/scripts/run_benchmarks.py --output benchmarks-native --cases cylinder thin_wall small_hole
      - name: Flujo de desarrollo y certificado descargable
        run: python visor/scripts/smoke_native.py --development --output smoke-development
      - name: Construir y probar carpeta portable Windows
        if: runner.os == 'Windows'
        run: |
          python visor/scripts/build_portable.py --output portable-test
          python visor/scripts/smoke_portable.py portable-test
      - name: Arranque y conversión real en el sistema nativo
        run: python visor/scripts/smoke_native.py --output smoke-native
      - name: Instalar y probar la entrega ZIP R20 con sus lanzadores Windows
        if: runner.os == 'Windows'
        run: python visor/scripts/smoke_r20_delivery.py --output smoke-r20-zip
