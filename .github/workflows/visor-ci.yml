name: Visor - pruebas nativas
on:
  push:
    branches: ['desarrollo/hoja-ruta-visor']
    paths: ['visor/**', '.github/workflows/visor-ci.yml']
  pull_request:
    paths: ['visor/**', '.github/workflows/visor-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64
      - name: Instalar dependencias y paquete de desarrollo
        run: |
          python -m pip install -r visor/requirements-test.txt
          python -m pip install -e ./visor --no-deps --no-build-isolation
          python -m pip check
      - name: Pruebas nuevas y geometría con control frío
        run: python -m pytest -q -p no:cacheprovider visor/tests --junitxml=visor-tests.xml
      - name: Batería histórica congelada
        run: python visor/scripts/run_legacy_tests.py --xml legacy-tests.xml
      - name: Arranque y conversión real en el sistema nativo
        run: python visor/scripts/smoke_native.py --output smoke-native
