name: Materializar la entrega R16 verificada
on:
  push:
    branches: [perfeccion_Visualizador_R16]
    paths:
      - 'entregas/perfeccion_Visualizador_R16/.partes/**'
      - 'entregas/perfeccion_Visualizador_R16/PARTES_SHA256.json'
      - 'entregas/perfeccion_Visualizador_R16/ensamblar_entrega.py'
      - '.github/workflows/publicar_r16.yml'
permissions:
  contents: write
concurrency:
  group: publicar-r16
  cancel-in-progress: false
jobs:
  materializar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verificar y reconstruir los archivos ya probados
        run: python entregas/perfeccion_Visualizador_R16/ensamblar_entrega.py
      - name: Guardar ZIP completo y fuentes en la misma rama
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f entregas/perfeccion_Visualizador_R16
          if ! git diff --cached --quiet; then
            git commit -m 'R16: materializar programa completo, fuentes y resultados verificados'
            git push origin HEAD:perfeccion_Visualizador_R16
          fi
